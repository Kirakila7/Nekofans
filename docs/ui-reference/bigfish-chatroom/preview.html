  const root = document.documentElement;

  const pendingStateWrites = new Map();

    Object.assign(

      {

        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),

  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              /** @type {unknown} */

              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

        target == null ||

#bigfish-room *,#bigfish-room *::before,#bigfish-room *::after {box-sizing:border-box}
#bigfish-room [hidden] {display:none!important}
#bigfish-room :where(h1,h2,p,ul) {margin:0}
#bigfish-room :where(button,select,textarea) {font:inherit;color:inherit}
#bigfish-room :where(button,select):focus-visible,#bigfish-room textarea:focus-visible {outline:2px solid var(--bf-accent);outline-offset:2px}
#bigfish-room :where(button,select) {cursor:inherit}
#bigfish-room i[data-lucide],#bigfish-room svg {width:17px;height:17px;flex:none}
#bigfish-room svg.lucide {stroke-width:1.75}
#bigfish-room i[data-lucide] {position:relative;display:inline-grid;place-items:center;font-style:normal;line-height:1}
#bigfish-room i[data-lucide=&quot;fish&quot;]::before {content:&quot;🐟&quot;;font-size:14px}
#bigfish-room i[data-lucide=&quot;messages-square&quot;]::before {content:&quot;◫&quot;}
#bigfish-room i[data-lucide=&quot;sparkles&quot;]::before {content:&quot;✧&quot;}
#bigfish-room i[data-lucide=&quot;smile&quot;]::before {content:&quot;☺&quot;;font-size:17px}
#bigfish-room i[data-lucide=&quot;paperclip&quot;]::before {
  content:&quot;&quot;;width:7px;height:13px;border:1.5px solid currentColor;border-radius:5px;transform:rotate(32deg);
}
#bigfish-room i[data-lucide=&quot;users-round&quot;]::before,#bigfish-room i[data-lucide=&quot;users-round&quot;]::after {
  content:&quot;&quot;;position:absolute;border:1.5px solid currentColor;
}
#bigfish-room i[data-lucide=&quot;users-round&quot;]::before {width:6px;height:6px;top:1px;border-radius:50%}
#bigfish-room i[data-lucide=&quot;users-round&quot;]::after {width:12px;height:6px;bottom:2px;border-radius:7px 7px 2px 2px}
#bigfish-room i[data-lucide=&quot;send&quot;]::before {content:&quot;↗&quot;}
#bigfish-room i[data-lucide=&quot;x&quot;]::before {content:&quot;×&quot;}
#bigfish-room .bf-appbar {
  min-height:55px;display:flex;align-items:center;gap:15px;padding:0 18px;
  background:var(--bf-chrome);border-bottom:1px solid var(--bf-line);
}
#bigfish-room .bf-brand,#bigfish-room .bf-profile,#bigfish-room .bf-path {display:flex;align-items:center;gap:8px;white-space:nowrap}
#bigfish-room .bf-brand strong {font-size:16px;letter-spacing:.01em}
#bigfish-room .bf-logo {display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--bf-send);color:var(--bf-send-ink)}
#bigfish-room .bf-app-divider {width:1px;height:17px;background:var(--bf-line)}
#bigfish-room .bf-path,#bigfish-room .bf-profile {color:var(--bf-muted);font-size:13px}
#bigfish-room .bf-profile {margin-left:auto}
#bigfish-room .bf-profile .bf-avatar {width:24px;height:24px;font-size:11px}
#bigfish-room .bf-workspace {display:grid;grid-template-columns:minmax(0,1fr) minmax(172px,21%);min-width:0}
#bigfish-room .bf-chat {min-width:0;padding:16px 18px 14px}
#bigfish-room .bf-banner {
  position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;
  border-radius:14px;isolation:isolate;
  background:radial-gradient(circle at 74% 24%,light-dark(#fcfcf5,#687eac) 0,transparent 38%),
    linear-gradient(113deg,light-dark(#e9f4ff,#253d67) 0%,light-dark(#c5dcff,#365784) 69%,light-dark(#b3d1fb,#304772) 100%);
}
#bigfish-room .bf-banner-copy {position:relative;z-index:2;padding:20px clamp(15px,4vw,34px)}
#bigfish-room h1 {font-size:clamp(21px,3.2vw,32px);font-weight:700;line-height:1.24;letter-spacing:.015em}
#bigfish-room .bf-online {display:inline-flex;gap:7px;align-items:center;margin-top:9px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--bf-muted)}
#bigfish-room .bf-online span,#bigfish-room .bf-dot {display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bf-green);flex:none}
#bigfish-room .bf-hero-fish {position:absolute;z-index:1;right:clamp(-90px,1.4vw,10px);bottom:-21px;width:clamp(235px,34vw,335px);max-width:none;pointer-events:none}
#bigfish-room .bf-waves {position:absolute;inset:0;overflow:hidden;pointer-events:none}
#bigfish-room .bf-waves::before,#bigfish-room .bf-waves::after {
  position:absolute;content:&quot;&quot;;border:1px solid light-dark(#ffffffad,#c0d8ff63);border-radius:50%;
}
#bigfish-room .bf-waves::before {width:17px;height:17px;right:28%;top:23%}
#bigfish-room .bf-waves::after {width:9px;height:9px;right:13%;top:16%}
#bigfish-room .bf-waves span {position:absolute;display:block;width:145%;height:100px;left:-26%;bottom:-76px;border-radius:50%;transform:rotate(-4deg);background:light-dark(#90b7f33d,#879bdd33)}
#bigfish-room .bf-waves span:nth-child(2) {bottom:-83px;left:-17%;transform:rotate(7deg);background:light-dark(#f6fcff99,#8cb3f329)}
#bigfish-room .bf-waves span:nth-child(3) {bottom:-92px;left:-20%;transform:rotate(1deg);background:light-dark(#dcecffd9,#a4c6ff29)}
#bigfish-room .bf-timeline {display:flex;flex-direction:column;gap:11px;padding:11px 3px 13px}
#bigfish-room .bf-time {display:flex;align-items:center;justify-content:center;gap:10px;color:var(--bf-muted);font-size:12px;font-variant-numeric:tabular-nums}
#bigfish-room .bf-time::before,#bigfish-room .bf-time::after {content:&quot;&quot;;height:1px;width:min(55px,12%);background:var(--bf-line)}
#bigfish-room .bf-message {display:flex;align-items:flex-start;gap:8px;min-width:0}
#bigfish-room .bf-from-me {flex-direction:row-reverse}
#bigfish-room .bf-avatar {
  display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:11px;
  font-size:12px;font-weight:650;background:light-dark(#e1edff,#2b4779);color:var(--bf-ink);
}
#bigfish-room .bf-mine {background:light-dark(#dbe9ff,#2f4772);color:var(--bf-accent)}
#bigfish-room .bf-friend {background:light-dark(#def1e9,#294d54);color:light-dark(#315f53,#c9ede7)}
#bigfish-room .bf-friend-two {background:light-dark(#efe7ff,#484266);color:light-dark(#5b4785,#e6d9ff)}
#bigfish-room .bf-fish-avatar {background:var(--bf-fish-face) center 40%/cover no-repeat,light-dark(#dbeaff,#354f79)}
#bigfish-room .bf-sender {display:flex;align-items:center;gap:6px;color:var(--bf-muted);font-size:12px;font-weight:600}
#bigfish-room .bf-ai {padding:0 5px;line-height:1.5;border-radius:5px;color:var(--bf-cat-label);background:var(--bf-cat)}
#bigfish-room .bf-message-body {min-width:0;max-width:min(81%,480px);display:grid;justify-items:start;gap:4px}
#bigfish-room .bf-from-me .bf-message-body {justify-items:end}
#bigfish-room .bf-bubble {width:fit-content;padding:7px 11px;background:var(--bf-paper);border-radius:4px 13px 13px;overflow-wrap:anywhere;white-space:pre-wrap}
#bigfish-room .bf-from-fish .bf-bubble {background:var(--bf-cat)}
#bigfish-room .bf-from-me .bf-bubble {background:var(--bf-own);border-radius:13px 4px 13px 13px}
#bigfish-room .bf-sticker {display:block;width:126px;max-width:100%;object-fit:contain}
#bigfish-room .bf-seed-sticker {height:56px;object-fit:cover;object-position:50% 50%;margin-left:-14px}
#bigfish-room .bf-message-media {display:block;max-width:100%;max-height:190px;border-radius:10px;object-fit:contain}
#bigfish-room .bf-message-file {color:var(--bf-accent);text-decoration:underline;overflow-wrap:anywhere}
#bigfish-room .bf-compose-area {position:relative}
#bigfish-room .bf-compose {background:var(--bf-paper);border:1px solid var(--bf-line);border-radius:14px;padding:8px 9px}
#bigfish-room textarea {display:block;resize:vertical;width:100%;min-height:29px;border:0;background:transparent;padding:2px 5px}
#bigfish-room textarea::placeholder {color:var(--bf-muted)}
#bigfish-room .bf-tools {display:flex;align-items:center;gap:3px;padding:3px 0 0}
#bigfish-room .bf-tool,#bigfish-room .bf-send,#bigfish-room .bf-icon-button {
  display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;
  border:1px solid transparent;border-radius:8px;background:none;padding:4px 7px;
}
#bigfish-room .bf-tool {color:var(--bf-muted);font-size:13px}
#bigfish-room .bf-tool:hover,#bigfish-room .bf-tool[aria-expanded=&quot;true&quot;],#bigfish-room .bf-icon-button:hover {background:var(--bf-chat);color:var(--bf-accent)}
#bigfish-room .bf-send {margin-left:auto;background:var(--bf-send);color:var(--bf-send-ink);padding-inline:12px;font-size:13px;font-weight:650}
#bigfish-room .bf-send:hover {filter:brightness(1.1)}
#bigfish-room .bf-send svg {width:14px;height:14px}
#bigfish-room .bf-notice {padding:6px 5px 0;color:var(--bf-cat-label);font-size:12px}
#bigfish-room .bf-stickers {
  position:absolute;z-index:3;bottom:calc(100% + 7px);left:0;display:flex;gap:5px;max-width:100%;
  padding:5px;border:1px solid var(--bf-line);border-radius:12px;background:var(--bf-paper);
  box-shadow:0 9px 22px light-dark(#203e6a2b,#0005);
}
#bigfish-room .bf-stickers button {width:82px;min-width:55px;border:0;border-radius:8px;background:var(--bf-chat);padding:4px;font-size:11px}
#bigfish-room .bf-stickers img {display:block;width:100%;height:54px;object-fit:cover}
#bigfish-room .bf-selection {max-width:100%;display:inline-flex;align-items:center;gap:5px;background:var(--bf-chat);border-radius:8px;padding:1px 4px 1px 8px;font-size:12px}
#bigfish-room .bf-selection-image {width:34px;height:28px;object-fit:cover;border-radius:5px}
#bigfish-room .bf-attachment-label {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bigfish-room .bf-remove {min-width:26px;padding:3px;flex:none}

&lt;script&gt;
(() =&gt; {
  const room = document.getElementById(&quot;bigfish-room&quot;);
  const form = room.querySelector(&quot;.bf-compose&quot;);
  const timeline = room.querySelector(&quot;.bf-timeline&quot;);
  const textarea = form.querySelector(&quot;textarea&quot;);
  const notice = form.querySelector(&quot;.bf-notice&quot;);
  const selectedRow = form.querySelector(&quot;.bf-selection&quot;);
  const previewImage = form.querySelector(&quot;.bf-selection-image&quot;);
  const attachmentIcon = selectedRow.querySelector(&quot;i&quot;);
  const attachmentLabel = form.querySelector(&quot;.bf-attachment-label&quot;);
  const fileInput = form.querySelector(&quot;.bf-file-input&quot;);
  const emojiTrigger = form.querySelector(&quot;.bf-emoji-trigger&quot;);
  const stickerMenu = room.querySelector(&quot;.bf-stickers&quot;);
  const assets = {
    wave: { url: room.querySelector(&#x27;[data-sticker=&quot;wave&quot;] img&#x27;).src, name: &quot;大肥鱼 · 挥手&quot; },
    happy: { url: room.querySelector(&#x27;[data-sticker=&quot;happy&quot;] img&#x27;).src, name: &quot;大肥鱼 · 开心&quot; },
  };
  let selected = null;

  function notify(text) {
    notice.textContent = text;
    notice.hidden = !text;
  }

  function toggleStickers(open) {
    stickerMenu.hidden = !open;
    emojiTrigger.setAttribute(&quot;aria-expanded&quot;, String(open));
  }

  function chooseAttachment(attachment, keepPrevious = false) {
    if (selected?.temporary &amp;&amp; !keepPrevious) URL.revokeObjectURL(selected.url);
    selected = attachment;
    selectedRow.hidden = !attachment;
    const showImage = attachment?.kind === &quot;image&quot; || attachment?.kind === &quot;sticker&quot;;
    previewImage.hidden = !showImage;
    if (showImage) previewImage.src = attachment.url;
    else previewImage.removeAttribute(&quot;src&quot;);
    const icon = selectedRow.querySelector(&quot;:scope &gt; svg&quot;) || attachmentIcon;
    if (icon) icon.hidden = showImage;
    attachmentLabel.textContent = attachment?.name || &quot;&quot;;
    notify(&quot;&quot;);
  }

  emojiTrigger.addEventListener(&quot;click&quot;, () =&gt; toggleStickers(stickerMenu.hidden));
  stickerMenu.addEventListener(&quot;click&quot;, event =&gt; {
    const button = event.target.closest(&quot;[data-sticker]&quot;);
    if (!button) return;
    chooseAttachment({ ...assets[button.dataset.sticker], kind: &quot;sticker&quot; });
    toggleStickers(false);
    textarea.focus();
  });
  room.addEventListener(&quot;keydown&quot;, event =&gt; {
    if (event.key === &quot;Escape&quot; &amp;&amp; !stickerMenu.hidden) {
      toggleStickers(false);
      emojiTrigger.focus();
    }
  });
  form.querySelector(&quot;.bf-file-trigger&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    toggleStickers(false);
    fileInput.click();
  });
  form.querySelector(&quot;.bf-remove&quot;).addEventListener(&quot;click&quot;, () =&gt; chooseAttachment(null));
  fileInput.addEventListener(&quot;change&quot;, () =&gt; {
    const file = fileInput.files[0];
    fileInput.value = &quot;&quot;;
    if (!file) return;
    const kind = file.type === &quot;image/gif&quot; ? &quot;sticker&quot;
      : [&quot;image/jpeg&quot;, &quot;image/png&quot;, &quot;image/webp&quot;].includes(file.type) ? &quot;image&quot;
      : file.type === &quot;video/mp4&quot; ? &quot;video&quot; : file.name.toLowerCase().endsWith(&quot;.txt&quot;) ? &quot;text&quot; : null;
    if (!kind) {
      notify(&quot;请选择 GIF、PNG、JPG、WebP、MP4 或 TXT 文件。&quot;);
      return;
    }
    const limit = kind === &quot;video&quot; ? 16 * 1024 * 1024 : kind === &quot;text&quot; ? 256 * 1024 : 5 * 1024 * 1024;
    if (!file.size || file.size &gt; limit) {
      notify(file.size ? &quot;这个文件超过大小限制。&quot; : &quot;这个文件是空的。&quot;);
      return;
    }
    chooseAttachment({ url: URL.createObjectURL(file), name: file.name, kind, temporary: true });
    textarea.focus();
  });

  function addMedia(body, attachment) {
    if (attachment.kind === &quot;text&quot;) {
      const link = document.createElement(&quot;a&quot;);
      link.className = &quot;bf-bubble bf-message-file&quot;;
      link.href = attachment.url;
      link.download = attachment.name;
      link.textContent = attachment.name;
      body.append(link);
      return;
    }
    const isVideo = attachment.kind === &quot;video&quot;;
    const element = document.createElement(isVideo ? &quot;video&quot; : &quot;img&quot;);
    element.className = attachment.kind === &quot;sticker&quot; ? &quot;bf-sticker&quot; : &quot;bf-message-media&quot;;
    element.src = attachment.url;
    if (isVideo) {
      element.controls = true;
      element.preload = &quot;metadata&quot;;
      element.setAttribute(&quot;aria-label&quot;, attachment.name);
    } else {
      element.alt = attachment.name;
    }
    body.append(element);
  }

  form.addEventListener(&quot;submit&quot;, event =&gt; {
    event.preventDefault();
    const text = textarea.value.trim();
    if (!text &amp;&amp; !selected) {
      notify(&quot;写一句话，或者选个表情或附件。&quot;);
      return;
    }
    const message = document.createElement(&quot;article&quot;);
    message.className = &quot;bf-message bf-from-me&quot;;
    const avatar = document.createElement(&quot;span&quot;);
    avatar.className = &quot;bf-avatar bf-mine&quot;;
    avatar.textContent = &quot;我&quot;;
    const body = document.createElement(&quot;div&quot;);
    body.className = &quot;bf-message-body&quot;;
    if (text) {
      const bubble = document.createElement(&quot;p&quot;);
      bubble.className = &quot;bf-bubble&quot;;
      bubble.textContent = text;
      body.append(bubble);
    }
    if (selected) addMedia(body, selected);
    message.append(avatar, body);
    timeline.append(message);
    textarea.value = &quot;&quot;;
    chooseAttachment(null, true);
    toggleStickers(false);
    textarea.focus();
  });
  textarea.addEventListener(&quot;keydown&quot;, event =&gt; {
    if (event.key === &quot;Enter&quot; &amp;&amp; !event.shiftKey &amp;&amp; !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

&lt;script id=&quot;codex-visualization-carousel&quot;&gt;
  (() =&gt; {
    for (const root of document.querySelectorAll(&quot;.viz-carousel&quot;)) {

        root.querySelectorAll(&quot;:scope &gt; [data-variant]&quot;),

      if (panels.length === 0) {

      }

        panel.hidden = index !== 0;
        panel.setAttribute(&quot;role&quot;, &quot;group&quot;);
        if (!panel.hasAttribute(&quot;aria-label&quot;)) {
          panel.setAttribute(&quot;aria-label&quot;, panel.dataset.variant);
        }

      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement(&quot;div&quot;);
      controls.className = &quot;viz-carousel-controls&quot;;
      // Portable copy of the settings dropdown&#x27;s legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      &lt;button type=&quot;button&quot; class=&quot;viz-carousel-previous cursor-interaction&quot;&gt;&lt;i data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
      &lt;details class=&quot;viz-carousel-picker&quot;&gt;
