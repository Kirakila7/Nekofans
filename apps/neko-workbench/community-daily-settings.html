<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'"><title>社区日常设置</title>
<style>body{margin:0;background:#f5f8fb;color:#25384a;font:15px/1.6 system-ui,sans-serif}main{max-width:540px;padding:28px;margin:auto}h1{font-size:22px;margin:0 0 10px}p{color:#556a7c}label{display:block;margin:22px 0 7px;font-weight:600}input,textarea{box-sizing:border-box;font:inherit;border:1px solid #b9cbd7;border-radius:10px;background:white;padding:10px;color:inherit}textarea{width:100%;min-height:132px;resize:vertical}button{font:inherit;background:#245f88;color:white;border:0;padding:9px 22px;border-radius:10px;cursor:pointer}button:disabled{opacity:.5;cursor:default}small{display:block;color:#556a7c;margin:6px 0 20px}#result{min-height:24px}*:focus-visible{outline:3px solid #6cadd6;outline-offset:2px}</style></head>
<body><main><h1>社区日常</h1><p>大肥鱼会根据当天主聊天互动，写下适合公开分享的小日常。</p><form id="settings"><label for="sendTime">每天发送时间（北京时间）</label><input id="sendTime" name="sendTime" type="time" required step="60" value="20:00"><small>到点后检查；工作时延后至当天空闲时，每天最多一条。应用关闭时不会发送。</small><label for="style">内容风格</label><textarea id="style" name="style" maxlength="300" placeholder="例如：像写小窝日记，温柔俏皮，多写感受，少用感叹号。"></textarea><small>最多 300 字。风格只影响表达方式，不会允许公开私人资料或编造经历。</small><button id="save" type="submit" disabled>保存设置</button><p id="result" role="status" aria-live="polite">正在读取设置…</p></form><small>保存不会开启自动发布。请在桌宠右键菜单“养鱼 → 社区日常”中开启，并完成社区登录和主聊天模型配置。</small></main><script src="community-daily-settings.js"></script></body></html>
