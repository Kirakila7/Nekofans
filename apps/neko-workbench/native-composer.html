<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="native-composer.css"><title>工作区浮动输入</title></head><body><section id="records" aria-label="项目记录" hidden><div id="records-resize" role="separator" aria-label="拖动调整项目记录大小" tabindex="0"></div><header><strong>项目记录</strong><button id="records-refresh" type="button">刷新</button></header><div id="records-status" role="status"></div><div id="records-list"></div><button id="records-more" type="button" hidden>加载更多</button></section><div id="target" class="target" aria-live="polite"></div><form id="composer" aria-label="工作区浮动输入"><button id="records-toggle" type="button" aria-expanded="false" title="项目记录" aria-label="展开项目记录">☰</button><button id="expand" type="button" aria-label="展开工作区" title="展开工作区">↗</button><button id="files" type="button" aria-label="打开当前项目目录" title="展开工作区并打开当前项目目录" disabled>▱</button><textarea id="message" rows="1" maxlength="30000" aria-label="工作任务" placeholder="工作区未连接" disabled></textarea><button id="copy" type="button" aria-label="选中恢复草稿以便复制" title="选中草稿后按 ⌘C 复制" hidden>⧉</button><button id="send" type="submit" aria-label="发送工作任务" disabled>↑</button></form><div id="status" role="status" aria-live="polite" class="status" hidden></div><script src="native-composer.js"></script></body></html>
