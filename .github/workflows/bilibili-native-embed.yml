name: Bilibili native prototype
on:
  pull_request:
    paths:
      - 'experiments/bilibili-native-embed/**'
      - '.github/workflows/bilibili-native-embed.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/bilibili-native-embed/**'
      - '.github/workflows/bilibili-native-embed.yml'
permissions:
  contents: read
jobs:
  protocol-and-build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protocol and lifecycle regressions
        run: node --test experiments/bilibili-native-embed/bridge-client.test.cjs
      - name: Syntax and native compilation
        shell: pwsh
        run: |
          Get-ChildItem experiments/bilibili-native-embed -File | Where-Object { $_.Extension -in '.js', '.cjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:exe /platform:x64 /r:System.Drawing.dll /r:System.Web.Extensions.dll "/out:$env:RUNNER_TEMP\WindowBridge.exe" experiments/bilibili-native-embed/WindowBridge.cs
          if ($LASTEXITCODE -ne 0) { throw 'Native helper compilation failed' }
      # A signed official client and an interactive desktop are required for the
      # documented local smoke tests. CI does not claim playback or UI acceptance.
