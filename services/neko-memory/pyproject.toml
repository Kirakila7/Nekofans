[project]
name = "neko-workbench-memory"
version = "0.1.0"
description = "Isolated upstream N.E.K.O. memory runtime for the DSH workbench"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "anyio==4.15.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "openai==2.26.0",
  "anthropic==0.76.0",
  "numpy==1.26.4",
  "sqlalchemy==2.1.1",
  "portalocker==2.10.1",
  "filelock==3.29.0",
  "regex==2026.9.10",
  "pywin32==312; sys_platform == 'win32'",
  "tiktoken==0.14.0",
  "onnxruntime==1.31.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "tokenizers==0.23.3",
  "psutil>=7.0.0,<8",
]

[tool.uv]
package = false
