<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekofans · 秘密规则棋局</title><style>
body{font:16px system-ui;margin:1.5rem auto;max-width:980px;padding:0 1rem;color:#293850;background:#f2f6fc}section{background:white;border:1px solid #d9e3f0;border-radius:16px;padding:1rem;margin:1rem 0}button,input{font:inherit;padding:.6rem;border:1px solid #cbd7e8;border-radius:8px}button{background:#dbe8fb;cursor:pointer}input{box-sizing:border-box;width:100%;margin:.4rem 0}iframe{box-sizing:border-box;width:100%;height:1050px;border:1px solid #cbd7e8;border-radius:12px}[hidden]{display:none!important}.notice{color:#7b4a13;background:#fff4dd;padding:.7rem;border-radius:10px}#error{color:#a62929}
</style></head><body><h1>🐟 Nekofans · 秘密规则棋局</h1><p class="notice">实验版：先双方加入，每方可提交一条秘密规则。暂支持“对手前 1～3 回合不能动某种棋子”。效果可能在对局中被对手推测；服务器、DeepSeek 与 Cloudflare 会处理规则。房间最长保留 6 小时。</p>
<section id="room"><p id="seat"></p><label>邀请朋友的链接<input id="invite" readonly></label><button id="join" hidden>加入对局</button><p id="status" role="status"></p><p id="error" role="alert"></p></section>
<section id="pairArea" hidden><button id="issuePair">关联我的工作台</button><p>配对码仅供自己的工作台使用，60 秒有效且只能用一次。不要发给对方或聊天室。</p><output id="pairCode" aria-live="polite"></output></section>
<section id="ruleArea" hidden><label>你的秘密规则<input id="rule" maxlength="80" placeholder="例如：对手第一回合不能动马"></label><button id="sendRule">提交给 DeepSeek</button><p id="ruleStatus"></p></section>
<section id="game" hidden><iframe id="frame" sandbox="allow-scripts" title="国际象棋棋盘"></iframe></section>
<script>
const $=id=>document.getElementById(id),state={id:new URL(location.href).searchParams.get('room'),token:null,version:0,view:null,loading:false,submitting:false};
const fragment=new URLSearchParams(location.hash.slice(1));const initial=fragment.get('seat');if(initial&&/^[A-Za-z0-9_-]{24}$/.test(initial)&&state.id){sessionStorage.setItem('private:'+state.id,initial);history.replaceState(null,'',location.pathname+location.search);}state.token=state.id?sessionStorage.getItem('private:'+state.id):null;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{...(state.token?{authorization:'Bearer '+state.token}:{}),...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(({unsupported:'这条规则暂不支持，请换成支持的形式',invalid:'规则无效',unavailable:'DeepSeek 暂不可用，请稍后重试',busy:'正在处理规则', 'already-submitted':'你已提交过规则'})[data.status]||data.error||'请求失败');return data;}
function problem(e){$('error').textContent=e.message||'请求失败';}function show(){$('invite').value=location.origin+'/?room='+encodeURIComponent(state.id);$('join').hidden=!!state.token;$('pairArea').hidden=!state.token;}
function publish(){if(state.view)$('frame').contentWindow?.postMessage({type:'nekofans:state',...state.view},'*');}
async function refresh(){if(state.loading||!state.id||!state.token)return;state.loading=true;try{const v=await api('/rooms/'+state.id+'/state');state.version=v.actions.length;state.view={seat:v.seat,ready:v.ready,actions:v.actions};$('seat').textContent=v.seat===0?'你是白方':'你是黑方';$('status').textContent=v.decisionRequired?'对局暂时暂停，需要双方商定如何继续':!v.executorOnline?'发布者的 DeepSeek 未连接':v.players<2?'等待朋友加入':v.ready?'双方已准备，可以开始':'双方请各自提交一条规则';$('ruleArea').hidden=v.players<2;$('rule').disabled=v.ownRuleStatus==='ready'||state.submitting;$('sendRule').disabled=v.ownRuleStatus==='ready'||state.submitting;$('ruleStatus').textContent=v.ownRuleStatus==='ready'?'你的规则已就绪':v.ownRuleStatus==='processing'?'DeepSeek 正在理解你的规则…':'规则只提交给执行者';$('game').hidden=false;if(!$('frame').dataset.loaded){const g=await api('/game');$('frame').dataset.loaded='yes';$('frame').srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data:">'+g.html;}else publish();}finally{state.loading=false;}}
$('join').onclick=async()=>{try{const v=await api('/rooms/'+state.id+'/join','POST');state.token=v.token;sessionStorage.setItem('private:'+state.id,v.token);show();await refresh();}catch(e){problem(e)}};
let pairTimer;$('issuePair').onclick=async()=>{const b=$('issuePair');b.disabled=true;$('pairCode').textContent='';try{const v=await api('/rooms/'+state.id+'/pair','POST',{});$('pairCode').textContent=v.code;clearTimeout(pairTimer);pairTimer=setTimeout(()=>{$('pairCode').textContent='配对码已过期，请重新生成。';},v.expiresInSeconds*1000);$('error').textContent='';}catch(e){problem(e)}finally{b.disabled=false}};
$('sendRule').onclick=async()=>{if(state.submitting)return;state.submitting=true;$('sendRule').disabled=true;$('error').textContent='';try{await api('/rooms/'+state.id+'/rule','POST',{rule:$('rule').value});$('rule').value='';await refresh();}catch(e){problem(e)}finally{state.submitting=false;await refresh().catch(problem)}};
window.addEventListener('message',async e=>{if(e.source!==$('frame').contentWindow||!e.data||typeof e.data!=='object')return;if(e.data.type==='nekofans:ready'){publish();return}if(e.data.type!=='nekofans:action'||typeof e.data.action!=='string')return;try{await api('/rooms/'+state.id+'/actions','POST',{action:e.data.action,expectedVersion:state.version});$('error').textContent='';await refresh()}catch(err){problem(err);await refresh().catch(problem)}});
if(!/^[A-Za-z0-9_-]{24}$/.test(state.id||'')){$('status').textContent='请从发布者的工作台创建棋局，或打开朋友发来的邀请链接。';}else{show();if(state.token)refresh().catch(problem);}setInterval(()=>{if(state.token)refresh().catch(problem)},3000);
</script></body></html>
