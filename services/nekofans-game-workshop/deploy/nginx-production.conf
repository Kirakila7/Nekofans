server {
  listen 80;
  server_name WORKSHOP_DOMAIN;
  return 301 https://WORKSHOP_DOMAIN$request_uri;
}

server {
  listen 443 ssl;
  server_name WORKSHOP_DOMAIN;
  ssl_certificate /etc/letsencrypt/live/WORKSHOP_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/WORKSHOP_DOMAIN/privkey.pem;
  client_max_body_size 650k;

  location / {
    proxy_pass http://127.0.0.1:3088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Nekofans-Client-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
